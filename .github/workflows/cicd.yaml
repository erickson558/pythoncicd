name: erickson fast api demo
on:
  push:
    branches:
      - master
      - develop
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          pip3 install -r requirements.txt
      - name: unittest
        run: |
          pytest test/test.py